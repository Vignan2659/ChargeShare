<style>
/* Layout: app header, then [phone mockup | guide panel] for the mobile app, or [sidebar | content] for the admin panel. */
:root {
  --bg: #F2F5F3; --surface: #FFFFFF; --surface-2: #EDF2EF; --ink: #16201A; --muted: #5B6A61; --line: #DAE3DD;
  --accent: #0F9D58; --accent-ink: #0B7A44; --accent-soft: #E1F3E9; --on-accent: #FFFFFF;
  --amber: #9A5A00; --amber-soft: #FCF0DA; --red: #C3352A; --red-soft: #FBE6E3; --blue: #1A64CE; --blue-soft: #E5EEFB;
  --map-land: #E6EEE8; --map-road: #FFFFFF; --map-water: #CBE1EE; --map-park: #D3E8D7; --phone: #111613; --shadow: 0 18px 50px rgba(20, 40, 28, .16);
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1310; --surface: #161D19; --surface-2: #1D2621; --ink: #E4ECE7; --muted: #98A99F; --line: #2A3530;
  --accent: #29B970; --accent-ink: #62D69A; --accent-soft: #15342A; --on-accent: #06140C;
  --amber: #F0B45A; --amber-soft: #3A2A12; --red: #F07B70; --red-soft: #3E1C19; --blue: #7DAAF2; --blue-soft: #1A2A44;
  --map-land: #1A231E; --map-road: #2B3631; --map-water: #183041; --map-park: #1D3226; --phone: #040605; --shadow: 0 18px 50px rgba(0, 0, 0, .5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1310; --surface: #161D19; --surface-2: #1D2621; --ink: #E4ECE7; --muted: #98A99F; --line: #2A3530;
  --accent: #29B970; --accent-ink: #62D69A; --accent-soft: #15342A; --on-accent: #06140C;
  --amber: #F0B45A; --amber-soft: #3A2A12; --red: #F07B70; --red-soft: #3E1C19; --blue: #7DAAF2; --blue-soft: #1A2A44;
  --map-land: #1A231E; --map-road: #2B3631; --map-water: #183041; --map-park: #1D3226; --phone: #040605; --shadow: 0 18px 50px rgba(0, 0, 0, .5); color-scheme: dark; }

* { box-sizing: border-box; }
html { background: var(--bg); }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top-in { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: -.01em; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; color: var(--on-accent); }
.brand small { font-family: var(--f-body); font-weight: 600; font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin-left: 4px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.who { display: flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 600; }
.who select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 10px; font-weight: 600; }
.spacer { flex: 1; }
.ghost-btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 10px; font-weight: 600; color: var(--muted); }

.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 48px; }

/* ---------- mobile view layout ---------- */
.mobile-view { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 920px) { .mobile-view { grid-template-columns: minmax(0, 1fr); } }

.phone { width: 100%; max-width: 390px; margin: 0 auto; background: var(--phone); border-radius: 46px; padding: 12px; box-shadow: var(--shadow); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); }
@media (max-width: 920px) { .phone { position: relative; top: 0; } }
.screen { background: var(--bg); border-radius: 36px; overflow: hidden; height: 760px; max-height: calc(100vh - 140px); min-height: 600px; display: flex; flex-direction: column; position: relative; }
.status { display: flex; justify-content: space-between; align-items: center; padding: 12px 26px 4px; font-weight: 700; font-size: 13px; background: var(--surface); }
.notch { width: 96px; height: 24px; border-radius: 20px; background: var(--phone); }
.appbar { display: flex; align-items: center; gap: 8px; padding: 8px 14px 12px; background: var(--surface); border-bottom: 1px solid var(--line); min-height: 52px; }
.appbar h2 { font-size: 17px; font-weight: 800; flex: 1; }
.back { border: 0; background: var(--surface-2); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
.body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.body.flush { padding: 0; gap: 0; }
.tabbar { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px 16px; }
.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); padding: 4px; position: relative; }
.tabbar button.on { color: var(--accent-ink); }
.tabbar .dot { position: absolute; top: 2px; right: calc(50% - 16px); background: var(--red); color: #fff; border-radius: 999px; font-size: 10px; min-width: 16px; height: 16px; display: grid; place-items: center; padding: 0 4px; }

.push { position: absolute; left: 10px; right: 10px; top: 44px; z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 10px 12px; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: flex-start; animation: drop .35s ease-out; }
.push .app-ico { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; }
.push b { display: block; font-size: 13px; }
.push span { font-size: 12.5px; color: var(--muted); }
@keyframes drop { from { transform: translateY(-16px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .push, .scanline { animation: none !important; } }

/* ---------- phone UI pieces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.card.tap { cursor: pointer; text-align: left; width: 100%; }
.card.tap:hover { border-color: var(--accent); }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap-r { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.t-title { font-weight: 800; font-size: 15.5px; }
.t-big { font-family: var(--f-display); font-weight: 800; font-size: 28px; letter-spacing: -.01em; }
.small { font-size: 12.5px; color: var(--muted); }
.lbl { font-size: 13px; font-weight: 700; }
.price { font-weight: 800; color: var(--accent-ink); }
.sec-h { font-weight: 800; font-size: 15px; margin-top: 4px; }
.btn { border: 0; border-radius: 12px; padding: 12px 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%; background: var(--accent); color: var(--on-accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sec { background: var(--accent-soft); color: var(--accent-ink); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 700; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.b-green { background: var(--accent-soft); color: var(--accent-ink); }
.b-amber { background: var(--amber-soft); color: var(--amber); }
.b-red { background: var(--red-soft); color: var(--red); }
.b-blue { background: var(--blue-soft); color: var(--blue); }
.notice { border-radius: 12px; padding: 10px 12px; font-size: 13px; display: flex; gap: 8px; align-items: flex-start; }
.n-blue { background: var(--blue-soft); color: var(--blue); }
.n-amber { background: var(--amber-soft); color: var(--amber); }
.n-green { background: var(--accent-soft); color: var(--accent-ink); }
.n-red { background: var(--red-soft); color: var(--red); }
.field { display: flex; flex-direction: column; gap: 5px; }
.field input, .field textarea, .field select { border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 10px 12px; font-size: 15px; width: 100%; }
.field textarea { min-height: 74px; resize: vertical; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); margin-top: 2px; flex: none; }
.info { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; }
.info svg { flex: none; color: var(--muted); margin-top: 1px; }
.hr { height: 1px; background: var(--line); }
.stars { color: #E9A800; font-weight: 700; display: inline-flex; align-items: center; gap: 3px; }
.photo { height: 170px; background: linear-gradient(135deg, var(--accent-soft), var(--surface-2)); display: grid; place-items: center; color: var(--accent-ink); position: relative; }
.photo .ph-lbl { position: absolute; bottom: 8px; right: 10px; font-size: 11px; color: var(--muted); }
.thumb { width: 58px; height: 58px; border-radius: 10px; background: linear-gradient(135deg, var(--accent-soft), var(--surface-2)); display: grid; place-items: center; color: var(--accent-ink); flex: none; }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.empty h3 { color: var(--ink); font-size: 16px; }

/* map */
.mapbox { position: relative; height: 330px; background: var(--map-land); overflow: hidden; }
.mapbox svg.base { position: absolute; inset: 0; width: 100%; height: 100%; }
.pin { position: absolute; transform: translate(-50%, -100%); border: 2px solid var(--surface); background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 11.5px; padding: 3px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
.pin.sel { background: var(--accent-ink); transform: translate(-50%, -100%) scale(1.12); z-index: 2; }
.me { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--blue); border: 3px solid var(--surface); transform: translate(-50%, -50%); box-shadow: 0 0 0 8px color-mix(in srgb, var(--blue) 22%, transparent); }
.map-tools { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; gap: 6px; }
.float { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 12.5px; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
.list-pad { padding: 14px; display: flex; flex-direction: column; gap: 10px; }

/* scan */
.cam { height: 360px; background: #0b0f0d; position: relative; display: grid; place-items: center; overflow: hidden; }
.cam .frame { width: 210px; height: 210px; border: 3px solid #fff; border-radius: 18px; position: relative; overflow: hidden; }
.scanline { position: absolute; left: 0; right: 0; height: 2px; background: #3DE08A; box-shadow: 0 0 12px #3DE08A; animation: scan 2s linear infinite; }
@keyframes scan { from { top: 0; } to { top: 100%; } }
.cam .hint { position: absolute; bottom: 14px; color: #d8e6dd; font-size: 12.5px; }
.qrbox { background: #fff; padding: 12px; border-radius: 12px; display: grid; place-items: center; min-height: 204px; min-width: 204px; }

/* ---------- guide panel ---------- */
.guide { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel h3 { font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: -.01em; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.intro h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(26px, 3.4vw, 38px); letter-spacing: -.02em; line-height: 1.08; }
.intro p { color: var(--muted); max-width: 62ch; margin: 8px 0 0; font-size: 15px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.step { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 12px; }
.step.cur { background: var(--accent-soft); }
.step .n { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 800; font-size: 12px; color: var(--muted); }
.step.done .n { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.step b { display: block; font-size: 14px; }
.step span { font-size: 12.5px; color: var(--muted); }
.screens { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.screens h4 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.screens button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 0; color: var(--accent-ink); font-weight: 600; }
.screens button:hover { text-decoration: underline; }
.log { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
.log-item { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 8px; font-size: 13px; }
.log-item time { color: var(--muted); font-family: var(--f-mono); font-size: 11.5px; padding-top: 2px; }
.log-item .k { font-weight: 700; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.rule { background: var(--surface-2); border-radius: 12px; padding: 12px; font-size: 13px; }
.rule b { display: block; margin-bottom: 2px; }

/* ---------- admin ---------- */
.admin { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .admin { grid-template-columns: minmax(0, 1fr); } .side { flex-direction: row !important; overflow-x: auto; position: static !important; } .side button { white-space: nowrap; } }
.side { display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); }
.side button { border: 0; background: none; text-align: left; padding: 9px 12px; border-radius: 10px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.side button.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 800; }
.side .cnt { background: var(--amber-soft); color: var(--amber); border-radius: 999px; padding: 0 7px; font-size: 12px; }
.a-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.a-head h2 { font-family: var(--f-display); font-weight: 800; font-size: 26px; letter-spacing: -.01em; }
.a-head p { margin: 4px 0 0; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.tile .k { color: var(--muted); font-size: 12.5px; font-weight: 600; }
.tile .v { font-family: var(--f-display); font-weight: 800; font-size: 28px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile.attn { border-color: var(--amber); }
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.money { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
th.money { text-align: right; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }
.a-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.a-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 4px 10px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; }
.filter { display: flex; gap: 6px; flex-wrap: wrap; }
.docimg { height: 110px; border-radius: 10px; border: 1px dashed var(--line); background: repeating-linear-gradient(45deg, var(--surface-2), var(--surface-2) 8px, var(--surface) 8px, var(--surface) 16px); display: grid; place-items: center; color: var(--muted); font-size: 12.5px; font-weight: 600; }

/* ---------- modal & toast ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(8, 14, 10, .5); z-index: 50; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 18px; padding: 20px; width: min(440px, 100%); display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); max-height: 90vh; overflow-y: auto; }

</style>

<header class="top">
  <div class="top-in">

      <button id="vApp" data-act="view" data-arg="app" role="tab">Mobile app</button>
      <button id="vAdmin" data-act="view" data-arg="admin" role="tab">Admin panel</button>
    </div>
    <label class="who" id="whoWrap" for="whoSel">Logged in as
      <select id="whoSel"></select>
    </label>
    <div class="spacer"></div>
    <button class="ghost-btn" data-act="reset">Reset demo</button>
  </div>
</header>

<div class="wrap" id="root"></div>

<script>
/* =====================================================================
   ChargeShare clickable prototype. All data is sample data held in memory.
   ===================================================================== */
const COMMISSION = 0.10;
const CONNECTORS = ["15A socket", "Type 2 (AC)", "CCS2 (DC)", "Bharat AC-001", "Bharat DC-001", "LECCS (2W)", "Ather connector"];
const VEH = { "2W": "Scooter / bike", "3W": "Auto", "4W": "Car" };

// ---------- icons ----------
const P = {
  bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/>',
  map: '<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  home: '<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="m12 12-2 4h4l-2 4"/>',

// ---------- business rules (same as the real backend) ----------
function inOffpeak(c, d) { if (!c.offpeak) return false; const t = d.getHours() * 60 + d.getMinutes(); return inWin(t, toMin(c.opS), toMin(c.opE)); }
/** Price in 15-minute steps so the host's off-peak rate applies to the part of the slot inside its window. */
function estimate(c, mins, start) {
  let total = 0;
  for (let m = 0; m < mins; m += 15) {
    const step = Math.min(15, mins - m);
    const rate = start && inOffpeak(c, new Date(start.getTime() + m * 60000)) ? c.offpeak : c.price;
    total += rate * (c.mode === "kwh" ? c.kw : 1) * (step / 60);
  }
  return Math.max(100, Math.ceil(total));
}
function reliability(c) {
  const ok = c.okSeed + D.bookings.filter((b) => b.charger === c.id && b.status === "completed").length;
  const bad = c.failSeed + D.bookings.filter((b) => b.charger === c.id && b.failed).length;
  return { ok, bad, pct: ok + bad >= 3 ? Math.round((100 * ok) / (ok + bad)) : null };
}
const relBadge = (c) => { const r = reliability(c); return r.pct == null ? "" : badge([`${r.pct}% reliable`, r.pct >= 90 ? "b-green" : r.pct >= 70 ? "b-amber" : "b-red"]); };
const memberOf = (uid, comId) => { const com = D.communities[comId]; return !!com && com.status === "approved" && com.members.some((m) => m.user === uid && m.status === "approved"); };
const dues = (uid) => D.bookings.filter((b) => b.driver === uid).flatMap((b) => b.extras.filter((x) => x.status === "due").map((x) => ({ ...x, booking: b })));
const freeNow = (c) => !c.offline && fits(c, new Date(), 60);
/** Before a booking is confirmed, drivers see only the area, not the exact address. */
const exactFor = (c, uid) => c.host === uid || D.bookings.some((b) => b.charger === c.id && b.driver === uid && ["confirmed", "active"].includes(b.status));
const placeLbl = (c, uid) => (exactFor(c, uid) ? c.address : `${c.area || "Area"} (approximate: exact address after booking)`);
function settle(b, final) { b.final = final; b.fee = Math.round(final * COMMISSION); b.earn = final - b.fee; }
function fits(c, start, mins, ignoreId) {
  const o = toMin(c.open), cl = toMin(c.close), end = start.getTime() + mins * 60000;
  for (let t = start.getTime(); t < end; t += 5 * 60000) { const d = new Date(t); if (!inWin(d.getHours() * 60 + d.getMinutes(), o, cl)) return false; }
  return !D.bookings.some((b) => b.charger === c.id && b.id !== ignoreId && blocking(b) && b.start.getTime() < end && endOf(b).getTime() > start.getTime());
}
function liveChargers() { return D.chargers.filter((c) => c.status === "approved" && D.users[c.host].host === "approved" && !D.users[c.host].deleted && (!c.community || c.host === UI.who || memberOf(UI.who, c.community))); }

function scrBook(id) {
  const c = charger(id); const u = me();
  if (!UI.book || UI.book.c !== c.id) UI.book = { c: c.id, day: 0, start: null, mins: 60, vehicle: c.vehicles.includes(u.vehicle) ? u.vehicle : c.vehicles[0], note: "" };
  const bk = UI.book;
  const days = Array.from({ length: 7 }, (_, i) => at(i, 0));
  const starts = [];
  for (let m = 0; m < 1440; m += 30) { const d = at(bk.day, 0, m); if (d.getTime() < Date.now() + 5 * 60000) continue; if (fits(c, d, 30)) starts.push(d); }
  const startD = bk.start ? new Date(bk.start) : null;
  const durs = [30, 60, 90, 120, 180, 240, 360].filter((m) => !startD || fits(c, startD, m));
  if (startD && !durs.includes(bk.mins)) bk.mins = durs[0] || 30;
  const total = startD ? estimate(c, bk.mins, startD) : 0;
  const myDues = dues(UI.who);
  return { title: "Book a slot", html: `
    <div class="card"><div class="t-title">${esc(c.title)}</div><div class="small">${priceLbl(c)} · ${esc(c.connector)} · ${c.kw} kW</div></div>
    <div class="sec-h">Day</div><div class="chips">${days.map((d, i) => `<button class="chip ${i === bk.day ? "on" : ""}" data-act="bkDay" data-arg="${i}">${dayLbl(d)}</button>`).join("")}</div>
    ${myDues.length ? `<button class="card tap" data-act="open" data-arg="dues"><div class="notice n-red">${ico("alert", 16)}<span>You have ${rs(myDues.reduce((a, x) => a + x.amount, 0))} in overstay dues. Pay them to book again. Tap to pay.</span></div></button>` : ""}
    ${c.offline ? `<div class="notice n-red">${ico("alert", 16)}<span>The host marked this charger temporarily unavailable.</span></div>` : ""}
    ${c.offpeak ? `<div class="notice n-blue">${ico("clock", 16)}<span>Cheaper off-peak rate ${rs(c.offpeak)} from ${c.opS} to ${c.opE}. The total includes it automatically.</span></div>` : ""}
    <div class="sec-h">Start time</div>
    ${starts.length && !c.offline ? `<div class="chips">${starts.map((d) => `<button class="chip ${startD && d.getTime() === startD.getTime() ? "on" : ""}" data-act="bkStart" data-arg="${d.getTime()}">${tm(d)}${c.offpeak && inOffpeak(c, d) ? " ☾" : ""}</button>`).join("")}</div>`
      : `<div class="small">${c.offline ? "Not bookable right now." : "No free slots on this day."}</div>`}
    ${!starts.length || c.offline || starts.length < 10 ? `<button class="btn sec" data-act="waitlist" data-arg="${c.id}:${bk.day}">${ico("clock", 16)} ${D.waitlist.some((w) => w.user === UI.who && w.charger === c.id && w.day === bk.day) ? "On the waitlist for this day ✓" : "Notify me if a slot opens"}</button>` : ""}
    <div class="sec-h">How long?</div><div class="chips">${durs.map((m) => `<button class="chip ${bk.mins === m ? "on" : ""}" data-act="bkDur" data-arg="${m}">${durLbl(m)}</button>`).join("")}</div>
    ${c.vehicles.length > 1 ? `<div class="sec-h">Your vehicle</div><div class="chips">${c.vehicles.map((v) => `<button class="chip ${bk.vehicle === v ? "on" : ""}" data-act="bkVeh" data-arg="${v}">${VEH[v]}</button>`).join("")}</div>` : ""}
    <div class="field"><label class="lbl" for="bkNote">Vehicle details (optional)</label><input id="bkNote" value="${esc(bk.note)}" placeholder="e.g. Nexon EV, white, TS09 AB 1234" data-input="bkNote"></div>
    ${startD ? `<div class="card"><div class="small">${dayLbl(startD)}, ${tm(startD)} – ${tm(new Date(startD.getTime() + bk.mins * 60000))}</div>
      <div class="row between"><span class="t-title">Total</span><span class="t-title num">${rs(total, 2)}</span></div>
      <div class="small">${c.mode === "kwh" ? `Up to ${c.kw} kW × ${durLbl(bk.mins)} at ${rs(c.price)}/kWh${c.offpeak ? ` (${rs(c.offpeak)} off-peak)` : ""}, maximum. Unused units refunded.` : `${durLbl(bk.mins)} at ${rs(c.price)}/hr${c.offpeak ? ` (${rs(c.offpeak)}/hr off-peak)` : ""}`}</div>
      ${c.idle ? `<div class="small">Overstay fee ${rs(c.idle)} per 15 min after a 15-min grace period.</div>` : ""}</div>` : ""}

      ${isDriver && c.idle ? `<label class="check"><input type="checkbox" id="lateIn"> <span class="small">Demo: I'm unplugging 40 minutes after my slot ended (overstay fee ${rs(c.idle)}/15 min after 15 min grace)</span></label>` : ""}
      <button class="btn" data-act="finish" data-arg="${b.id}">${ico("check", 16)} Finish charging</button></div>`);
  if (isDriver && shared) acts.push(`<button class="btn danger" data-act="brokenToggle">${ico("alert", 16)} Charger not working? Get a full refund</button>
      ${UI.broken === b.id ? `<div class="card"><div class="small">What's wrong? You get a full refund straight away and the host is told.</div>${["No power / doesn't start", "Connector doesn't fit", "Damaged or unsafe", "Can't get access"].map((r) => `<button class="btn sec" data-act="notWorking" data-arg="${b.id}:${r}">${r}</button>`).join("")}</div>` : ""}`);
  if (!isDriver && b.checklist) acts.push(`<div class="notice n-green">${ico("shield", 16)}<span>Driver confirmed the safety checklist at ${tm(b.checklist)}: cable OK, connector matches, area dry.</span></div>`);

  if (b.status === "completed" && !b.reviewed.includes(UI.who)) acts.push(`<button class="btn" data-act="open" data-arg="review:${b.id}">${ico("star", 16)} ${isDriver ? "Rate this charger" : "Rate this driver"}</button>`);

      <div class="info">${ico("bolt", 16)}<span>${esc(c.connector)} · ${c.kw} kW · ${c.mode === "kwh" ? `${rs(b.unit)}/kWh` : `${rs(b.unit)}/hr`}${b.extended ? ` · extended ${b.extended} min` : ""}</span></div>

    <div class="card"><div class="lbl">Payment</div>

function earnings(uid) {
  const rows = D.bookings.filter((b) => b.host === uid && b.earn > 0);
  const now = new Date();
  const paid = D.payouts.filter((p) => p.host === uid && p.status === "paid").reduce((a, p) => a + p.amount, 0);
  const xs = D.bookings.filter((b) => b.host === uid).flatMap((b) => b.extras.filter((x) => x.earn));
  const unpaid = (x) => !x.payout || D.payouts.find((p) => p.id === x.payout).status !== "paid";
  const pending = rows.filter(unpaid).reduce((a, b) => a + b.earn, 0) + xs.filter(unpaid).reduce((a, x) => a + x.earn, 0);
  return { total: rows.reduce((a, b) => a + b.earn, 0) + xs.reduce((a, x) => a + x.earn, 0), month: rows.filter((b) => b.start.getMonth() === now.getMonth() && b.start.getFullYear() === now.getFullYear()).reduce((a, b) => a + b.earn, 0), pending, paid, sessions: rows.filter((b) => b.status === "completed").length, rows };
}

function statement(comId) {
  const com = D.communities[comId]; const now = new Date();
  const rows = {};
  D.bookings.filter((b) => b.status === "completed" && charger(b.charger)?.community === comId && b.start.getMonth() === now.getMonth() && b.start.getFullYear() === now.getFullYear())
    .forEach((b) => { const r = (rows[b.driver] ||= { sessions: 0, kwh: 0, amount: 0 }); r.sessions++; r.kwh += b.kwh ?? charger(b.charger).kw * (b.mins / 60); r.amount += b.final || 0; });
  return Object.entries(rows).map(([uid, r]) => ({ flat: com.members.find((m) => m.user === uid)?.flat || "—", name: D.users[uid].name, ...r })).sort((a, b) => a.flat.localeCompare(b.flat));
}

    <div class="sec-h">Requests to join (${pend.length})</div>

const val = (id) => (document.getElementById(id)?.value ?? "").trim();
const A = {
  view: (v) => { UI.view = v; render(); window.scrollTo(0, 0); },

  login: () => { UI.loggedIn[UI.who] = true; UI.nav = initialNav(UI.who); render(); },

  confirmBook: () => {
    const bk = UI.book; const c = charger(bk.c); const start = new Date(bk.start);
    if (!fits(c, start, bk.mins)) { toast("That slot was just taken. Pick another time."); return render(); }
    if (dues(UI.who).length) { toast("Pay your pending dues first"); return; }
    const amount = estimate(c, bk.mins, start);
    const unit = c.mode === "kwh" ? Math.round(amount / (c.kw * (bk.mins / 60))) : c.price;
    const b = { id: D.nextB++, charger: c.id, driver: UI.who, host: c.host, start, mins: bk.mins, status: "pending_payment", mode: c.mode, unit, amount, final: null, refund: 0, fee: 0, earn: 0, kwh: null, vehicle: bk.vehicle, note: bk.note, reason: "", by: "", payout: null, reviewed: [], extras: [], failed: false, checklist: null, extended: 0 };
    D.bookings.push(b); log("Booking", `#${b.id} created, waiting for payment (${rs(b.amount)})`);
    UI.nav = [{ s: "tab", tab: "bookings" }, { s: "booking", id: b.id }, { s: "pay", id: b.id }]; render();
  },
  pay: (id) => {

    setTimeout(() => {
      const b = booking(id); const c = charger(b.charger);
      if (b.status !== "pending_payment") return;
      b.status = c.instant && !c.community ? "confirmed" : "requested";
      log("Payment", `${rs(b.amount)} received for #${b.id} via Razorpay`);
      if (c.instant && !c.community) { notify(b.host, "New booking", `${c.title} was booked for ${slot(b)}.`, b.id); notify(b.driver, "Booking confirmed", `${c.title} is booked for you.`, b.id); }
      else { notify(b.host, "New booking request", `${me().name.split(" ")[0]} wants to charge at ${c.title}. Accept it in the app.`, b.id); notify(b.driver, "Request sent", "Payment received. Waiting for the host to accept.", b.id); }

  hostAccept: (id) => { const b = booking(id); b.status = "confirmed"; log("Booking", `#${b.id} accepted by host`); notify(b.driver, "Booking confirmed", `${charger(b.charger).title} accepted your booking.`, b.id); render(); toast("Accepted. The driver can now see your address and phone."); },
  hostDecline: (id) => modal({ title: "Decline this request?", text: "The driver gets a full refund.", fields: [{ id: "r", label: "Reason (optional)", value: "Not available at that time" }], ok: "Decline", danger: true,
    onOk: (v) => { const b = booking(id); b.status = "declined"; b.by = "host"; b.reason = v.r; b.refund = b.amount; log("Refund", `${rs(b.amount)} refunded for #${b.id}`); notifyWait(b); notify(b.driver, "Booking declined", "The host couldn't take this booking. Full refund issued.", b.id); } }),
  cancelBk: (id) => {

    const text = b.status === "pending_payment" ? "Nothing has been paid yet." : isDriver ? (refund === b.amount ? `You'll get a full refund of ${rs(refund, 2)}.` : `Your slot starts in under an hour, so you'll get a 50% refund (${rs(refund, 2)}).`) : "The driver gets a full refund.";
    modal({ title: "Cancel booking?", text, ok: "Cancel booking", danger: true, onOk: () => {

    log("Report", `New ${val("rpCat").toLowerCase()} report from ${me().name.split(" ")[0]}`); back(); toast("Report sent. The team will get back to you.");
  },
  addDoc: () => { UI.applyDocs = Math.min(3, (UI.applyDocs || 0) + 1); render(); },
  submitApply: () => {
    const upi = val("apUpi"); if (!/^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(upi)) { toast("Enter a valid UPI ID, like name@okaxis"); return; }
    const u = me(); u.upi = upi; u.docs = UI.applyDocs; u.host = "pending"; u.note = "";
    log("Host", `${u.name} applied to become a host`); toast("Application sent. Now add your charger.");
    UI.form = null; UI.nav = [{ s: "tab", tab: "host" }, { s: "chargerForm" }]; render();
  },
  cfVeh: (k) => { const F = UI.form; F.vehicles = F.vehicles.includes(k) ? F.vehicles.filter((x) => x !== k) : [...F.vehicles, k]; render(); },
  cfConn: (x) => { UI.form.connector = x; render(); },
  cfMode: (m) => { UI.form.mode = m; render(); },
  cfAll: () => { UI.form.allDay = document.getElementById("cfAll").checked; render(); },
  saveCharger: (id) => {
    const F = UI.form; const title = val("cfTitle"), address = val("cfAddr");
    const kw = Number(val("cfKw")), price = Number(val("cfPrice"));
    if (title.length < 3) return toast("Add a listing title");
    if (address.length < 5) return toast("Add the address");
    if (!F.vehicles.length) return toast("Pick at least one vehicle type");
    if (!(kw > 0) || !(price > 0)) return toast("Enter the power (kW) and price");
    const data = { title, address, desc: val("cfDesc"), access: val("cfAccess"), vehicles: F.vehicles, connector: F.connector, kw, mode: F.mode, price: Math.round(price * 100),
      open: F.allDay ? "00:00" : val("cfOpen") || "07:00", close: F.allDay ? "00:00" : val("cfClose") || "22:00", instant: document.getElementById("cfInstant").checked,
      society: document.getElementById("cfSociety").checked, noc: document.getElementById("cfNoc").checked, x: F.x, y: F.y,
      area: val("cfArea"), offpeak: F.offpeakOn ? Math.round(Number(val("cfOpP") || 0) * 100) || null : null, opS: F.offpeakOn ? val("cfOpS") || "22:00" : "22:00", opE: F.offpeakOn ? val("cfOpE") || "06:00" : "06:00",
      idle: Math.round(Number(val("cfIdle") || 0) * 100), community: F.community || null };
    if (data.society) data.instant = false;
    if (id) { const c = charger(id); const reviewed = ["title", "address", "connector", "kw"].some((k) => c[k] !== data[k]) || c.x !== data.x; Object.assign(c, data); if (reviewed && c.status !== "pending") { c.status = "pending"; c.note = "Changes waiting for review"; } log("Charger", `${c.title} updated${reviewed ? ", sent for re-review" : ""}`); toast("Saved"); }
    else { const c = { ...data, id: D.nextC++, host: UI.who, status: "pending", note: "", reviews: [], photos: 2, safety: false, qr: qrCode(), societyName: data.society ? "My society" : "", offline: false, offReason: "", okSeed: 0, failSeed: 0 }; D.chargers.push(c); log("Charger", `${me().name.split(" ")[0]} submitted "${c.title}" for review`); toast("Submitted. You'll get a notification when it's live."); }
    UI.form = null; UI.nav = [{ s: "tab", tab: "host" }]; render();
  },
  placePin: (_, ev) => { const box = ev.currentTarget.getBoundingClientRect(); UI.form.x = Math.min(0.95, Math.max(0.05, (ev.clientX - box.left) / box.width)); UI.form.y = Math.min(0.95, Math.max(0.1, (ev.clientY - box.top) / box.height)); render(); },
  newQr: (id) => modal({ title: "Generate a new QR code?", text: "The old QR sticker stops working. Print and stick the new one.", ok: "Generate", onOk: () => { charger(id).qr = qrCode(); toast("New QR code ready"); } }),
  pause: (id) => { const c = charger(id); c.status = c.status === "paused" ? "approved" : "paused"; log("Charger", `${c.title} ${c.status === "paused" ? "paused" : "resumed"}`); render(); },
  removeCharger: (id) => {
    const c = charger(id);
    if (D.bookings.some((b) => b.charger === c.id && ["requested", "confirmed", "active"].includes(b.status))) return toast("This charger has upcoming bookings. Finish or cancel them first.");
    modal({ title: "Remove this charger?", text: "It disappears from the map. You can't undo this.", ok: "Remove", danger: true, onOk: () => { D.chargers = D.chargers.filter((x) => x.id !== c.id); UI.nav = [{ s: "tab", tab: "host" }]; log("Charger", `${c.title} removed`); } });
  },
  editProfile: () => { const u = me(); modal({ title: "Edit profile", fields: [{ id: "n", label: "Full name", value: u.name }, { id: "v", label: "Vehicle (2W, 3W, 4W or blank)", value: u.vehicle }], ok: "Save", onOk: (v) => { if (v.n.length < 2) { toast("Enter your name"); return false; } u.name = v.n; u.vehicle = ["2W", "3W", "4W"].includes(v.v.toUpperCase()) ? v.v.toUpperCase() : ""; toast("Profile saved"); } }); },
  legal: (k) => modal({ title: k === "terms" ? "Terms of use" : "Privacy policy", text: k === "terms" ? "ChargeShare connects hosts and drivers. Hosts confirm safe installation and society permission. Cancellation: full refund 1 hour or more before, 50% after. Platform fee 10%." : "We collect your phone number, name, location while the app is open, booking history and (for hosts) ID proof and UPI ID. Contact details are shared only for confirmed bookings. You can delete your account anytime.", ok: "Close", onOk: () => {} }),
  deleteAcct: () => modal({ title: "Delete account?", text: "This cancels your open bookings with refunds, removes your chargers and erases your personal details. It can't be undone. (In this demo, Reset demo brings everything back.)", ok: "Delete", danger: true, onOk: () => {
    const u = me(); D.bookings.filter((b) => (b.driver === u.id || b.host === u.id) && ["pending_payment", "requested", "confirmed"].includes(b.status)).forEach((b) => { b.status = "cancelled"; b.by = "system"; b.reason = "Account deleted"; b.refund = b.amount; });
    D.chargers.filter((c) => c.host === u.id).forEach((c) => (c.status = "paused")); u.deleted = true; u.host = "none"; UI.loggedIn[u.id] = false; log("Account", `${u.name} deleted their account`); toast("Account deleted");
  } }),
  pushTap: () => { const id = UI.push?.bookingId; UI.push = null; if (id) { UI.nav = [{ s: "tab", tab: booking(id).host === UI.who ? "host" : "bookings" }, { s: "booking", id }]; } render(); },
  scope: (s) => { UI.scope = s; render(); },
  story: (i) => { const s = STORY[Number(i)]; if (s.view === "admin") { UI.view = "admin"; UI.adminTab = s.tab; if (s.tab === "hosts") UI.adminFilter.hosts = "pending"; } else { UI.view = "app"; UI.who = s.who; UI.loggedIn[s.who] = true; UI.nav = s.nav.map((x) => ({ ...x })); } render(); window.scrollTo({ top: 0, behavior: "smooth" }); },
  jump: (arg) => { const [g, i] = arg.split(":").map(Number); const [, items, who] = SCREENS[g]; UI.view = "app"; UI.who = who; UI.loggedIn[who] = true; items[i][1](); render(); window.scrollTo({ top: 0, behavior: "smooth" }); },
  adminJump: (t) => { UI.view = "admin"; UI.adminTab = t; render(); window.scrollTo(0, 0); },
  adminTab: (t) => { UI.adminTab = t; render(); },
  aFilter: (arg) => { const [k, v] = arg.split(":"); UI.adminFilter[k] = v; render(); },
  aApproveHost: (id) => { const u = D.users[id]; u.host = "approved"; u.note = ""; log("Admin", `Approved host ${u.name}`); notify(id, "You're a host now!", "Your verification is approved. Your chargers go live once reviewed."); render(); toast(`${u.name} is now a verified host`); },
  aRejectHost: (id) => modal({ title: `Reject ${D.users[id].name}?`, fields: [{ id: "r", label: "Reason (shown to the user)", value: "ID photo is not clear. Please upload again.", type: "area" }], ok: "Reject", danger: true,
    onOk: (v) => { const u = D.users[id]; u.host = "rejected"; u.note = v.r; D.chargers.filter((c) => c.host === id && c.status === "approved").forEach((c) => (c.status = "paused")); log("Admin", `Rejected host ${u.name}`); notify(id, "Host verification", v.r); } }),
  aApproveCharger: (id) => { const c = charger(id); modal({ title: `Approve "${c.title}"?`, fields: [{ id: "s", label: "Mark as safety checked (photos show earthing and an RCCB)", value: c.safety, type: "check" }, { id: "n", label: "Note to host (optional)", value: "" }], ok: "Approve",
    onOk: (v) => { c.status = "approved"; c.safety = v.s; c.note = v.n; log("Admin", `Approved charger ${c.title}`); notify(c.host, "Charger approved", D.users[c.host].host === "approved" ? `${c.title} is live now.` : `${c.title} goes live once your host verification is approved.`); toast(D.users[c.host].host === "approved" ? "Charger is live on the map" : "Approved. It goes live once the host is approved too."); } }); },
  aRejectCharger: (id) => modal({ title: `Reject "${charger(id).title}"?`, fields: [{ id: "r", label: "What should the host fix?", value: "Please add a clear photo of the charger and the parking spot.", type: "area" }], ok: "Reject", danger: true,
    onOk: (v) => { const c = charger(id); c.status = "rejected"; c.note = v.r; log("Admin", `Rejected charger ${c.title}`); notify(c.host, "Charger needs changes", v.r); } }),
  aCancel: (id) => modal({ title: `Cancel booking #${id}?`, text: "The driver gets a full refund.", fields: [{ id: "r", label: "Reason", value: "" }], ok: "Cancel with full refund", danger: true,
    onOk: (v) => { const b = booking(id); b.status = "cancelled"; b.by = "admin"; b.reason = v.r || "Cancelled by support"; b.refund = b.amount; log("Admin", `Cancelled #${b.id}, ${rs(b.amount)} refunded`); notify(b.driver, "Refund issued", `${rs(b.amount)} is on its way back to you.`, b.id); notify(b.host, "Booking cancelled", `Support cancelled booking #${b.id}.`, b.id); } }),
  aRefund: (id) => { const b = booking(id); const max = b.amount - b.refund; modal({ title: `Refund booking #${id}`, text: `Up to ${rs(max, 2)} can be refunded.${b.payout && D.payouts.find((p) => p.id === b.payout)?.status === "paid" ? " The host was already paid; settle that separately." : " The host's earning goes down by the same amount."}`, fields: [{ id: "a", label: "Amount in ₹", value: String(Math.min(max, 5000) / 100), num: true }, { id: "r", label: "Reason", value: "Goodwill refund" }], ok: "Refund",
    onOk: (v) => { const amt = Math.round(Number(v.a) * 100); if (!(amt > 0) || amt > max) { toast(`Enter an amount up to ${rs(max, 2)}`); return false; } b.refund += amt; if (b.final != null) settle(b, Math.max(0, b.final - amt)); b.reason = (b.reason ? b.reason + " | " : "") + "Admin refund: " + v.r; b.by = b.by || "admin"; log("Admin", `Refunded ${rs(amt)} on #${b.id}`); notify(b.driver, "Refund issued", `${rs(amt)} is on its way back to you.`, b.id); } }); },
  aResolve: (id) => { const r = D.reports.find((x) => x.id === Number(id)); modal({ title: "Reply and resolve", text: esc(r.msg), fields: [{ id: "r", label: "Reply to the user", value: "Thanks for telling us. We've spoken to the host and the socket has been fixed.", type: "area" }], ok: "Send and resolve",
    onOk: (v) => { r.status = "resolved"; r.reply = v.r; log("Admin", `Resolved report #${r.id}`); notify(r.from, "Update on your report", v.r); } }); },
  aGenPayouts: () => {
    const owed = [...D.bookings.filter((b) => b.earn > 0 && !b.payout), ...D.bookings.flatMap((b) => b.extras.filter((x) => x.earn && !x.payout).map((x) => Object.assign(x, { host: b.host })))];
    if (!owed.length) return toast("No new earnings to pay out");
    const byHost = {}; owed.forEach((b) => (byHost[b.host] ||= []).push(b));
    Object.entries(byHost).forEach(([h, items]) => { const p = { id: D.nextP++, host: h, amount: items.reduce((a, b) => a + b.earn, 0), count: items.filter((x) => x.charger).length, upi: D.users[h].upi, status: "pending", ref: "" }; D.payouts.push(p); items.forEach((b) => (b.payout = p.id)); });
    UI.adminFilter.payouts = "pending"; log("Admin", `Created ${Object.keys(byHost).length} payout(s)`); render(); toast(`Created ${Object.keys(byHost).length} payout(s)`);
  },
  aMarkPaid: (id) => { const p = D.payouts.find((x) => x.id === Number(id)); modal({ title: `Mark ${rs(p.amount, 2)} as paid`, text: `Send it to <b class="mono">${esc(p.upi)}</b> from the business account, then enter the UPI transaction reference (UTR).`, fields: [{ id: "u", label: "UTR / reference", value: "UTR" + Math.floor(100000000 + Math.random() * 899999999) }], ok: "Mark paid",
    onOk: (v) => { if (v.u.length < 3) { toast("Enter the UTR"); return false; } p.status = "paid"; p.ref = v.u; log("Payout", `${rs(p.amount)} paid to ${D.users[p.host].name}`); notify(p.host, "Payout sent", `${rs(p.amount)} sent to ${p.upi}. Ref ${v.u}`); } }); },
  nowOnly: () => { UI.nowOnly = !UI.nowOnly; UI.selPin = null; render(); },
  waitlist: (arg) => {
    const [cid, day] = arg.split(":").map(Number);
    if (D.waitlist.some((w) => w.user === UI.who && w.charger === cid && w.day === day)) return toast("You're already on the waitlist for this day");
    D.waitlist.push({ user: UI.who, charger: cid, day, notified: false });
    log("Waitlist", `${me().name.split(" ")[0]} is waiting for ${charger(cid).title} on ${dayLbl(at(day, 0))}`);
    toast("You're on the waitlist. We'll notify you if a slot opens."); render();
  },
  extend: (arg) => {
    const [id, m] = arg.split(":").map(Number); const b = booking(id); const c = charger(b.charger);
    if (endOf(b) < new Date()) return toast("Your slot has already ended");
    if (!fits(c, endOf(b), m, b.id)) return toast("Someone has booked the next slot, or the charger closes. Can't extend.");
    const amount = Math.max(100, estimate(c, m, endOf(b)));
    modal({ title: `Extend by ${m} minutes?`, text: `New end time ${tm(new Date(endOf(b).getTime() + m * 60000))}. You pay ${rs(amount, 2)} for the extra time by UPI.`, ok: `Pay ${rs(amount)}`, onOk: () => {
      b.extras.push({ id: Date.now(), kind: "extension", minutes: m, amount, status: "paid" });
      b.mins += m; b.amount += amount; b.extended = (b.extended || 0) + m;
      if (c.mode === "kwh") b.unit = Math.round(b.amount / (c.kw * (b.mins / 60)));
      log("Payment", `${rs(amount)} paid to extend #${b.id} by ${m} min`); notify(b.host, "Booking extended", `Booking #${b.id} now ends ${m} minutes later.`, b.id); toast("Extended");
    } });
  },
  payDue: (arg) => {
    const [bid, xid] = arg.split(":").map(Number); const b = booking(bid); const x = b.extras.find((e) => e.id === xid);
    modal({ title: `Pay overstay fee ${rs(x.amount)}?`, text: `You stayed ${x.minutes} minutes past your slot at ${esc(charger(b.charger).title)}.`, ok: "Pay by UPI", onOk: () => {
      x.status = "paid"; x.fee = Math.round(x.amount * COMMISSION); x.earn = x.amount - x.fee;
      log("Payment", `Overstay fee ${rs(x.amount)} paid for #${b.id}; host gets ${rs(x.earn)}`); notify(b.host, "Overstay fee received", `You earned ${rs(x.earn)} extra for booking #${b.id}.`, b.id); toast("Paid. You can book again.");
    } });
  },
  brokenToggle: () => { const id = Number(cur().id); UI.broken = UI.broken === id ? null : id; render(); },
  notWorking: (arg) => {
    const i = arg.indexOf(":"); const b = booking(arg.slice(0, i)); const reason = arg.slice(i + 1); const c = charger(b.charger);
    modal({ title: "Report charger not working?", text: `"${esc(reason)}". We'll cancel this booking and refund ${rs(b.amount, 2)} in full straight away.`, ok: "Report and refund", danger: true, onOk: () => {
      b.status = "cancelled"; b.by = "system"; b.reason = "Charger not working: " + reason; b.refund = b.amount; b.failed = true; UI.broken = null;
      log("Refund", `${rs(b.amount)} refunded instantly for #${b.id} (charger not working)`);
      notify(b.host, "Driver reported a problem", `Your charger didn't work for booking #${b.id}: ${reason}`, b.id);
      const recent = D.bookings.filter((x) => x.charger === c.id && x.failed).length;
      if (recent >= 2 && !c.offline) { c.offline = true; c.offReason = "Reported not working. The host is checking it."; log("Charger", `${c.title} taken offline automatically after ${recent} reports`); notify(c.host, "Charger taken offline", `${c.title} was reported not working ${recent} times. Fix it, then switch it back on.`); }
      notifyWait(b); toast(`Full refund of ${rs(b.amount)} issued`);
    } });
  },
  chk: (k) => { UI.checks[k] = !UI.checks[k]; render(); },
  receipt: (id) => {
    const b = booking(id); const c = charger(b.charger);
    const row = (k, v) => `<tr><td>${k}</td><td class="money">${v}</td></tr>`;
    modal({ title: `Receipt #${b.id}`, ok: "Close", onOk: () => {}, extra: `<div class="tbl-wrap"><table>
      ${row("Charger", esc(c.title))}${row("Slot", slot(b))}${b.extended ? row("Extended by", b.extended + " min") : ""}${b.kwh != null ? row("Energy used", b.kwh + " kWh") : ""}
      ${row("Paid upfront", rs(b.amount, 2))}${row("Refunded", rs(b.refund, 2))}
      ${b.extras.filter((x) => x.kind === "overstay").map((x) => row(`Overstay fee (${x.minutes} min, ${x.status})`, rs(x.amount, 2))).join("")}
      ${b.final != null ? row("Charging cost", rs(b.final, 2)) + row("of which service fee (10%)", rs(b.fee, 2)) + row("of which paid to host", rs(b.earn, 2)) : ""}
      </table></div><p class="small">Prices include applicable taxes. Payments by Razorpay. The real app opens this as a printable page.</p>` });
  },
  offline: (id) => { const c = charger(id); if (c.offline) { c.offline = false; c.offReason = ""; toast("Back online"); } else { c.offline = true; c.offReason = val("offR"); toast("Marked temporarily unavailable"); } log("Charger", `${c.title} is ${c.offline ? "offline" : "back online"}`); render(); },
  cfOffpeak: () => { UI.form.offpeakOn = !UI.form.offpeakOn; render(); },
  cfSoc: (id) => { UI.form.community = id || null; render(); },
  socMode: (m) => { UI.socMode = m; render(); },
  socJoin: () => {
    const code = val("socCode").toUpperCase(); const flat = val("socFlat");
    const c = Object.values(D.communities).find((x) => x.code === code && x.status === "approved");
    if (!c) return toast("No approved society with that code");
    if (!flat) return toast("Add your flat number");
    const m = c.members.find((x) => x.user === UI.who);
    if (m) { m.status = m.status === "approved" ? "approved" : "pending"; m.flat = flat; } else c.members.push({ user: UI.who, flat, status: "pending" });
    UI.socMode = "none"; log("Society", `${me().name.split(" ")[0]} asked to join ${c.name} (flat ${flat})`); notify(c.manager, "New resident request", `${me().name} (flat ${flat}) wants to join ${c.name}`); toast("Request sent to the society manager"); render();
  },
  socCreate: () => {
    const name = val("socName"), address = val("socAddr"), flat = val("socFlat2");
    if (name.length < 3 || address.length < 5 || !flat) return toast("Fill in the name, address and your flat");
    const id = "soc" + Date.now(); D.communities[id] = { id, name, address, code: qrCode().replace("-", "").slice(0, 6), manager: UI.who, status: "pending", members: [{ user: UI.who, flat, status: "approved" }] };
    UI.socMode = "none"; log("Society", `${name} registered by ${me().name.split(" ")[0]}, waiting for verification`); toast("Submitted. ChargeShare will verify it."); render();
  },
  socDecide: (arg) => {
    const [id, uid, st] = arg.split(":"); const c = D.communities[id]; const m = c.members.find((x) => x.user === uid); m.status = st;
    log("Society", `${D.users[uid].name} ${st === "approved" ? "approved" : "removed"} in ${c.name}`);
    notify(uid, c.name, st === "approved" ? "You're in! Society chargers now show up on your map." : "Your request to join was not approved."); render();
  },
  aSocDecide: (arg) => { const [id, st] = arg.split(":"); const c = D.communities[id]; c.status = st; log("Admin", `${st === "approved" ? "Approved" : "Rejected"} society ${c.name}`); notify(c.manager, c.name, st === "approved" ? `Approved! Share join code ${c.code} with residents.` : "Your society was not approved."); render(); },
  aOffline: (id) => { const c = charger(id); c.offline = !c.offline; c.offReason = c.offline ? "Being checked by the ChargeShare team" : ""; log("Admin", `${c.title} ${c.offline ? "taken offline" : "back online"}`); notify(c.host, "Charger status changed", `${c.title} is now ${c.offline ? "offline" : "back online"}.`); render(); },
  gap: (i) => { GAPS[Number(i)].go(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); },
  modalClose: () => closeModal(),
  modalOk: () => modalOk(),
};

function notifyWait(b) {
  const day = Math.round((new Date(b.start).setHours(0, 0, 0, 0) - new Date().setHours(0, 0, 0, 0)) / 864e5);
  D.waitlist.filter((w) => w.charger === b.charger && w.day === day && !w.notified && w.user !== b.driver).forEach((w) => {
    w.notified = true; notify(w.user, "A slot just opened", `${charger(b.charger).title} has a free slot ${dayLbl(b.start).toLowerCase()}. Book it before someone else does.`);
  });
}
const allChecked = () => UI.checks.cable && UI.checks.conn && UI.checks.dry;
function checkIn(id, code) {
  const b = booking(id); const c = charger(b.charger);
  if (!allChecked()) return toast("Tick the safety checklist first");
  if (!code || code.replace(/\s/g, "") !== c.qr) return toast("This QR code belongs to a different charger");
  b.status = "active"; b.checklist = new Date(); log("Session", `Driver checked in at ${c.title} (#${b.id})`);
  notify(b.host, "Driver arrived", `Charging started at ${c.title}.`, b.id);
  UI.nav = [{ s: "tab", tab: "bookings" }, { s: "booking", id: b.id }]; render(); toast("Charging started. Plug in your vehicle.");
}

// delegated events
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act; if (!A[act]) return;
  if (el.tagName === "INPUT") { A[act](el.dataset.arg, ev); return; }
  if (act === "modalClose" && ev.target !== el && el.classList.contains("modal-bg")) return;
  ev.preventDefault();
  A[act](el.dataset.arg, { currentTarget: el, clientX: ev.clientX, clientY: ev.clientY });
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && modalCb) closeModal();
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches(".tile[data-act]")) { ev.preventDefault(); A[ev.target.dataset.act](ev.target.dataset.arg); }
});
document.addEventListener("input", (ev) => { if (ev.target.dataset.input === "bkNote" && UI.book) UI.book.note = ev.target.value; });
document.getElementById("whoSel").addEventListener("change", (ev) => { UI.who = ev.target.value; UI.nav = initialNav(UI.who); UI.push = null; UI.book = null; UI.form = null; render(); });

render();
setInterval(() => { const s = document.querySelector(".status .num"); if (s) s.textContent = nowClock(); }, 30000);
</script>
